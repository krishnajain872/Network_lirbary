syntax = "proto3";

package networklib.oms;

import "stream_envelope.proto";

// ============================================================================
// ORDER MANAGEMENT SYSTEM - DOMAIN SPECIFIC DEFINITIONS
// ============================================================================

enum Side {
  SIDE_UNKNOWN = 0;
  BUY = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNKNOWN = 0;
  LIMIT = 1;
  MARKET = 2;
  STOP_LOSS = 3;
  STOP_LIMIT = 4;
}

enum TimeInForce {
  TIF_UNKNOWN = 0;
  GTC = 1; // Good Till Cancel
  IOC = 2; // Immediate or Cancel
  FOK = 3; // Fill or Kill
}

// 1. Specific Order Buy Proto
message OrderBuy {
  string symbol = 1;
  double price = 2;
  double quantity = 3;
  OrderType type = 4;
  TimeInForce time_in_force = 5;
  string client_order_id = 6;
  string account_id = 7;
}

// 2. Specific Order Sell Proto
message OrderSell {
  string symbol = 1;
  double price = 2;
  double quantity = 3;
  OrderType type = 4;
  TimeInForce time_in_force = 5;
  string client_order_id = 6;
  string account_id = 7;
}

// 3. Specific Order Modify Proto
message OrderModify {
  string order_id = 1;
  string client_order_id = 2; // Optional, for correlation
  double new_price = 3;
  double new_quantity = 4;
  string account_id = 5;
}

// 4. Specific Order Cancel Proto
message OrderCancel {
  string order_id = 1;
  string client_order_id = 2;
  string symbol = 3;
  string account_id = 4;
}

// 5. Specific Trade Proto (Execution Report)
message Trade {
  string trade_id = 1;
  string order_id = 2;
  string symbol = 3;
  Side side = 4;
  double price = 5;
  double quantity = 6;
  int64 timestamp_us = 7;
  string execution_id = 8;
  double commission = 9;
  string commission_asset = 10;
}

// 6. Specific Market Data Proto
message MarketData {
  string symbol = 1;
  double last_price = 2;
  double last_quantity = 3;
  double bid_price = 4;
  double bid_quantity = 5;
  double ask_price = 6;
  double ask_quantity = 7;
  int64 timestamp_us = 8;
  // For 3D visualization or heatmaps
  double volume_24h = 9;
  double price_change_percent_24h = 10;
}

// Bulk Order Request (for Load Testing)
message BulkOrderRequest {
  repeated OrderBuy buy_orders = 1;
  repeated OrderSell sell_orders = 2;
  bool atomic = 3; // All or nothing
}

// Response for Bulk Operations
message BulkOrderResponse {
  int32 success_count = 1;
  int32 failure_count = 2;
  repeated string order_ids = 3;
  repeated string error_messages = 4;
  int64 processing_time_us = 5;
}
