scenarios:
  # ==========================================
  # Standard Non-Secure Tests
  # ==========================================
  - name: "Raw TCP Echo"
    type: "tcp"
    mode: "raw"
    target: "127.0.0.1:9001"
    steps:
      - action: connect
      - action: send
        data: "Hello Raw"
      - action: expect
        data: "Hello Raw"
      - action: disconnect

  - name: "Proto TCP Echo"
    type: "tcp"
    mode: "proto"
    target: "127.0.0.1:9002"
    steps:
      - action: connect
      - action: send
        data: "Hello Proto"
      - action: expect
        data: "Hello Proto"
      - action: disconnect

  - name: "Raw UDP Packet"
    type: "udp"
    mode: "raw"
    target: "127.0.0.1:9003"
    steps:
      - action: connect
      - action: send
        data: "UDP Pkt"
      - action: expect
        data: "UDP Pkt"
      - action: disconnect

  # ==========================================
  # Advanced Protocols (Non-Secure)
  # ==========================================
  - name: "gRPC Call"
    type: "grpc"
    mode: "proto"
    target: "127.0.0.1:9007"
    steps:
      - action: connect
      - action: send
        data: "RPC Request"
      - action: expect
        data: "RPC Request"
      - action: disconnect

  - name: "RPC Call"
    type: "rpc"
    mode: "proto"
    target: "127.0.0.1:9008"
    steps:
      - action: connect
      - action: send
        data: "RPC Data"
      - action: expect
        data: "RPC Data"
      - action: disconnect

  - name: "QUIC Stream"
    type: "quic"
    mode: "proto"
    target: "127.0.0.1:9010"
    steps:
      - action: connect
      - action: send
        data: "QUIC Data"
      - action: expect
        data: "QUIC Data"
      - action: disconnect

  # ==========================================
  # Secure Tests (TLS)
  # ==========================================
  - name: "Secure TCP Echo"
    type: "tcp"
    mode: "proto"
    secure: true
    target: "127.0.0.1:9011"
    steps:
      - action: connect
      - action: send
        data: "Secret TCP"
      - action: expect
        data: "Secret TCP"
      - action: disconnect

  - name: "Secure HTTP Request"
    type: "http"
    mode: "proto"
    secure: true
    target: "127.0.0.1:9012"
    steps:
      - action: connect
      - action: send
        data: "GET /secure"
      - action: expect
        data: "GET /secure"
      - action: disconnect
