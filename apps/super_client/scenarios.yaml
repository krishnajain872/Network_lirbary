scenarios:
  - name: "Raw TCP Echo"
    type: "tcp"
    mode: "raw"
    target: "127.0.0.1:9001"
    steps:
      - action: connect
      - action: send
        data: "Hello Raw World"
      - action: expect
        data: "Hello Raw World"
      - action: disconnect

  - name: "Proto TCP Echo"
    type: "tcp"
    mode: "proto"
    target: "127.0.0.1:9002"
    steps:
      - action: connect
      - action: send
        data: "Hello Proto World"
      - action: expect
        data: "Hello Proto World"
      - action: disconnect

  - name: "Raw UDP Packet"
    type: "udp"
    mode: "raw"
    target: "127.0.0.1:9003"
    steps:
      - action: connect
      - action: send
        data: "UDP Packet"
      - action: expect
        data: "UDP Packet"
      - action: disconnect

  - name: "Proto UDP Packet"
    type: "udp"
    mode: "proto"
    target: "127.0.0.1:9004"
    steps:
      - action: connect
      - action: send
        data: "UDP Proto"
      - action: expect
        data: "UDP Proto"
      - action: disconnect

  - name: "HTTP Get (Raw)"
    type: "tcp"
    mode: "raw"
    target: "127.0.0.1:9005"
    steps:
      - action: connect
      - action: send
        data: "GET / HTTP/1.1\r\nHost: localhost\r\n\r\n"
      - action: expect
        data: "HTTP/1.1 200 OK"
        # Note: ScenarioEngine expects exact match by default.
        # A real HTTP client would parse, but here we just check if response starts with 200 OK
        # or contains it. The simple engine might fail on exact match if headers differ.
        # We'll rely on the engine implementation finding the substring or exact match.
        # If strict match is enforced, this might be flaky.
        # Let's assume for this demo the server returns a predictable string.
      - action: disconnect
