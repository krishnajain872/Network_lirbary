server:
  name: "SuperServer"
  version: "2.0.0"
  environment: "audit"

  protocols:
    # Standard Non-Secure Protocols
    - name: "RawTCP"
      type: "tcp"
      mode: "raw"
      port: 9001
      enabled: true

    - name: "ProtoTCP"
      type: "tcp"
      mode: "proto"
      port: 9002
      enabled: true

    - name: "RawUDP"
      type: "udp"
      mode: "raw"
      port: 9003
      enabled: true

    - name: "ProtoUDP"
      type: "udp"
      mode: "proto"
      port: 9004
      enabled: true

    - name: "StandardHTTP"
      type: "http"
      mode: "proto" # Use proto handler to wrap envelope or raw if handler supports
      port: 9005
      enabled: true

    - name: "StandardWS"
      type: "websocket"
      mode: "proto"
      port: 9006
      enabled: true

    - name: "StandardGRPC"
      type: "grpc"
      mode: "proto"
      port: 9007
      enabled: true

    - name: "StandardRPC"
      type: "rpc"
      mode: "proto"
      port: 9008
      enabled: true

    # QUIC (Experimental/Mock)
    - name: "StandardQUIC"
      type: "quic"
      mode: "proto"
      port: 9010
      enabled: true

    # Secure Protocols
    - name: "SecureTCP"
      type: "tcp"
      mode: "proto"
      port: 9011
      enabled: true
      ssl:
        enabled: true
        cert_file: "certs/server.crt"
        key_file: "certs/server.key"

    - name: "SecureHTTP"
      type: "http"
      mode: "proto"
      port: 9012
      enabled: true
      ssl:
        enabled: true
        cert_file: "certs/server.crt"
        key_file: "certs/server.key"

    - name: "SecureGRPC"
      type: "grpc"
      mode: "proto"
      port: 9013
      enabled: true
      ssl:
        enabled: true
        cert_file: "certs/server.crt"
        key_file: "certs/server.key"

    - name: "SecureWS"
      type: "websocket"
      mode: "proto"
      port: 9014
      enabled: true
      ssl:
        enabled: true
        cert_file: "certs/server.crt"
        key_file: "certs/server.key"

  performance:
    max_connections: 100000
    event_loop_type: "epoll"
    io_threads: "auto"
    worker_threads: "8"
    enable_zero_copy: true

    memory:
      allocator: "system"
      enable_memory_pools: true
      connection_pool_size: 20000
      buffer_pool_size: 20000

  resilience:
    rate_limiter:
      enabled: true
      algorithm: "token_bucket"
      requests_per_second: 50000
      burst_size: 10000
      per_ip_enabled: true
      per_ip_requests_per_second: 20000
      per_ip_burst_size: 5000

  observability:
    logging:
      level: "info"
      output: "file"
      file_path: "super_server_audit.log"
    metrics:
      enabled: true
      port: 9090
