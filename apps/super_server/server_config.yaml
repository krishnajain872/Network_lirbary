server:
  name: "SuperServer"
  version: "1.0.0"
  environment: "benchmark"

  protocols:
    - name: "RawTCP"
      type: "tcp"
      mode: "raw"
      port: 9001
      enabled: true

    - name: "ProtoTCP"
      type: "tcp"
      mode: "proto"
      port: 9002
      enabled: true

    - name: "RawUDP"
      type: "udp"
      mode: "raw"
      port: 9003
      enabled: true

    - name: "ProtoUDP"
      type: "udp"
      mode: "proto"
      port: 9004
      enabled: true

    - name: "StandardHTTP"
      type: "http"
      mode: "raw"
      # HTTP handler normally parses raw bytes anyway, but 'raw' mode ensures
      # we bypass strict StreamEnvelope requirements if implemented that way.
      # For standard http handler usage, type=http is usually sufficient.
      port: 9005
      enabled: true

    - name: "StandardWS"
      type: "websocket"
      mode: "raw"
      port: 9006
      enabled: true

  performance:
    max_connections: 100000
    event_loop_type: "epoll"
    io_threads: "4"
    worker_threads: "8"
    enable_zero_copy: true
    use_sendfile: true
    use_splice: true

    memory:
      allocator: "system"
      enable_memory_pools: true
      connection_pool_size: 20000
      buffer_pool_size: 20000
      enable_huge_pages: true
      huge_page_size_mb: 2

    cpu:
      enable_cpu_affinity: true
      isolated_cores: [0, 1, 2, 3]

  resilience:
    rate_limiter:
      enabled: true
      algorithm: "token_bucket"
      requests_per_second: 5000
      burst_size: 500
      per_ip_enabled: true
      per_ip_requests_per_second: 1000
      per_ip_burst_size: 100

    circuit_breaker:
      enabled: true
      failure_threshold_percentage: 50
      success_threshold: 5
      timeout_ms: 10000

  observability:
    logging:
      level: "info"
      output: "file"
      file_path: "super_server.log"
      compress: false

    metrics:
      enabled: true
      port: 9090
      format: "prometheus"
      path: "/metrics"
