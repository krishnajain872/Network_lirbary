client:
  name: "hft-client"
  network:
    host: "127.0.0.1"
    port: 7000
    protocol: "tcp"
    timeout_ms: 5000
    socket:
      tcp_nodelay: true
      so_rcvbuf: 8388608
      so_sndbuf: 8388608

  performance:
    io_threads: 1
    event_loop_type: "epoll"

  observability:
    logging:
      level: "info"
