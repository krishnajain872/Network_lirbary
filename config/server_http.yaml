server:
  mode: "http"

  network:
    host: "0.0.0.0"
    port: 80
    protocol: "tcp"
    socket:
      so_reuseport: true
      tcp_nodelay: false       # Allow packet aggregation for throughput

  protocols:
    http:
      enabled: true
      port: 80
      version: "1.1"

  performance:
    io_threads: "auto"
    enable_zero_copy: true     # Reduce memory copying

  observability:
    logging:
      level: "info"
